name: Сообщить об ошибке
description: Опишите воспроизводимый сбой или неправильное поведение V8:Pulsar
title: "[Ошибка] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за сообщение. Не прикладывайте пароли, ключи доступа, выгрузки информационных баз и другие конфиденциальные данные.
  - type: textarea
    id: result
    attributes:
      label: Что произошло
      description: Опишите наблюдаемый результат и чем он мешает работе.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что ожидалось
      description: Опишите правильный результат.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      description: Перечислите действия по порядку.
      placeholder: |
        1. Запустить…
        2. Открыть…
        3. Выполнить…
    validations:
      required: true
  - type: input
    id: pulsar-version
    attributes:
      label: Версия V8:Pulsar
      placeholder: Например, 0.2.0
    validations:
      required: true
  - type: input
    id: platform-version
    attributes:
      label: Версия платформы 1С
      placeholder: Например, 8.3.27.1606
  - type: input
    id: windows-version
    attributes:
      label: Версия Windows
      placeholder: Например, Windows 11 24H2
  - type: textarea
    id: evidence
    attributes:
      label: Журналы и снимки
      description: Приложите только материалы без конфиденциальных данных. Текст журнала лучше вставить в блок кода.
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка данных
      options:
        - label: Я проверил вложения и удалил из них пароли, ключи доступа и конфиденциальные данные.
          required: true
